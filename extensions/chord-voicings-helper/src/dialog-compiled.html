<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Voicing Tools</title>
  <style>
    :root {
      --bg:        #383838;
      --panel:     #2C2C2C;
      --surface:   #4E4E4E;
      --border:    #1a1a1a;
      --accent:    #FF8C00;
      --accent-hv: #FFA500;
      --text:      #DDDDDD;
      --text-dim:  #888888;
      --chip-sel:  #FF8C00;
      --chip-text: #111111;
      --row-sel:   #3d3d3d;
      --row-focus: #464646;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 820px; height: 560px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Lucida Grande', 'Lucida Sans Unicode', sans-serif;
      font-size: 12px;
      overflow: hidden;
      user-select: none;
    }

    .layout {
      display: grid;
      grid-template-rows: 34px 1fr 36px;
      height: 100%;
    }

    /* ── Header ── */
    .header {
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title { font-size: 13px; font-weight: bold; }
    .header-sub   { font-size: 11px; color: var(--text-dim); }

    /* ── Body ── */
    .body {
      display: grid;
      grid-template-columns: 230px 1fr;
      overflow: hidden;
    }

    /* ── Left panel ── */
    .controls {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px 3px;
      flex-shrink: 0;
    }
    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }
    .section-action {
      font-size: 10px;
      color: var(--text-dim);
      cursor: pointer;
      text-decoration: underline;
    }
    .section-action:hover { color: var(--text); }

    /* ── Groups list ── */
    .groups-list {
      flex: 1;
      overflow-y: auto;
      border-bottom: 1px solid var(--border);
      min-height: 0;
    }

    .group-row {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: start;
      padding: 5px 8px 5px 6px;
      cursor: pointer;
      border-left: 2px solid transparent;
      gap: 4px;
    }
    .group-row:hover   { background: var(--row-sel); }
    .group-row.focused { background: var(--row-focus); border-left-color: var(--accent); }
    .group-row.checked { background: var(--row-sel); }
    .group-row.focused.checked { background: var(--row-focus); }

    .group-check {
      padding-top: 1px;
      display: flex;
      align-items: flex-start;
    }
    .group-check input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
      width: 13px; height: 13px;
    }

    .group-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .group-time { font-size: 10px; color: var(--text-dim); }
    .group-chord { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-row.focused .group-chord { color: var(--accent); }
    .group-notes-raw { font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .group-strategy-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-dim);
      white-space: nowrap;
      align-self: center;
    }
    .group-row.checked .group-strategy-badge {
      background: #5a3a00;
      color: var(--accent);
    }

    /* ── Interpretations ── */
    .candidates-area {
      padding: 4px 10px;
      border-bottom: 1px solid var(--border);
      min-height: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .chord-chip {
      padding: 2px 7px;
      border-radius: 10px;
      background: #555;
      color: var(--text);
      cursor: pointer;
      font-size: 11px;
      border: 1px solid transparent;
    }
    .chord-chip.selected { background: var(--chip-sel); color: var(--chip-text); font-weight: bold; }
    .chord-chip:hover:not(.selected) { background: #666; }
    .no-candidates { font-size: 11px; color: var(--text-dim); font-style: italic; }

    /* ── Strategy + Register ── */
    .bottom-controls {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }

    .strategy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    .strategy-btn {
      padding: 3px 6px;
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 3px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: 11px;
    }
    .strategy-btn:hover { background: var(--surface); }
    .strategy-btn.selected { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .strategy-btn.full { grid-column: 1 / -1; }

    .register-row { display: flex; gap: 3px; }
    .register-btn {
      flex: 1;
      padding: 3px;
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 3px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      text-align: center;
    }
    .register-btn.selected { background: var(--surface); border-color: var(--accent); color: var(--accent); }

    /* ── Right panel ── */
    .viz-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top half: Notation + Pitches side by side */
    .viz-top-row {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      min-height: 0;
    }

    .viz-cell {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .viz-cell-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      padding: 3px 8px 0;
      flex-shrink: 0;
    }
    .viz-cell-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 4px 8px;
    }

    .pitch-list { display: flex; flex-direction: column; gap: 3px; align-items: center; }
    .pitch-badge {
      background: var(--surface);
      padding: 2px 10px;
      border-radius: 3px;
      font-size: 12px;
      min-width: 54px;
      text-align: center;
    }

    /* Bottom: Piano + Audio controls */
    .viz-bottom {
      flex-shrink: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 4px 8px 6px;
    }

    #piano-container {
      overflow-x: auto;
      line-height: 0;
    }
    #piano-container svg { display: block; }

    /* Audio controls */
    .audio-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 5px;
    }

    .audio-play-btn {
      padding: 3px 10px;
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: 3px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      flex-shrink: 0;
    }
    .audio-play-btn:hover { background: #666; }
    .audio-play-btn:active { background: #555; }

    .instrument-btns { display: flex; gap: 3px; }
    .instrument-btn {
      padding: 3px 8px;
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 3px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
    }
    .instrument-btn.selected { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .instrument-btn:hover:not(.selected) { background: var(--surface); }

    /* ── Footer ── */
    .footer {
      padding: 0 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-info { color: var(--text-dim); font-size: 11px; }

    .btn-row { display: flex; gap: 8px; }
    button.primary {
      padding: 5px 16px;
      background: var(--accent); border: none; border-radius: 2px;
      color: #000; font-family: inherit; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    button.primary:hover { background: var(--accent-hv); }
    button.primary:disabled { background: #666; color: #999; cursor: default; }
    button.secondary {
      padding: 5px 16px;
      background: #666; border: none; border-radius: 2px;
      color: var(--text); font-family: inherit; font-size: 12px; cursor: pointer;
    }
    button.secondary:hover { background: #777; }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Header -->
    <div class="header">
      <span class="header-title">Chord Voicing Tools</span>
      <span class="header-sub" id="header-sub"></span>
    </div>

    <!-- Body -->
    <div class="body">
      <!-- Left panel -->
      <div class="controls">

        <div class="section-header">
          <span class="section-label">Chords in clip</span>
          <span class="section-action" id="select-all-link">Select all</span>
        </div>

        <div class="groups-list" id="groups-list"></div>

        <div class="section-header">
          <span class="section-label">Interpretations</span>
        </div>
        <div class="candidates-area" id="candidates-area"></div>

        <div class="bottom-controls">
          <div>
            <div class="section-label" style="margin-bottom:4px;">Strategy <span style="color:#666;font-size:9px;font-weight:normal;text-transform:none;">(focused chord)</span></div>
            <div class="strategy-grid" id="strategy-list">
              <button class="strategy-btn" data-strategy="close">Close</button>
              <button class="strategy-btn" data-strategy="open">Open</button>
              <button class="strategy-btn" data-strategy="shell">Shell</button>
              <button class="strategy-btn" data-strategy="drop2">Drop 2</button>
              <button class="strategy-btn" data-strategy="drop3">Drop 3</button>
              <button class="strategy-btn" data-strategy="guidetones">Guide Tones</button>
              <button class="strategy-btn full" data-strategy="bestmix">Best Mix (all checked)</button>
            </div>
          </div>
          <div>
            <div class="section-label" style="margin-bottom:4px;">Register <span style="color:#666;font-size:9px;font-weight:normal;text-transform:none;">(checked or focused)</span></div>
            <div class="register-row">
              <button class="register-btn" data-register="low">Low</button>
              <button class="register-btn selected" data-register="mid">Mid</button>
              <button class="register-btn" data-register="high">High</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right panel -->
      <div class="viz-panel">

        <!-- Top: Notation + Pitches -->
        <div class="viz-top-row">
          <div class="viz-cell">
            <div class="viz-cell-label">Notation</div>
            <div class="viz-cell-content"><div id="notation-container"></div></div>
          </div>
          <div class="viz-cell">
            <div class="viz-cell-label">Pitches</div>
            <div class="viz-cell-content"><div class="pitch-list" id="pitch-list"></div></div>
          </div>
        </div>

        <!-- Bottom: Piano + Audio controls -->
        <div class="viz-bottom">
          <div class="viz-cell-label" style="margin-bottom:3px;">Piano</div>
          <div id="piano-container"></div>
          <div class="audio-controls">
            <button class="audio-play-btn" id="btn-preview">▶ Preview</button>
            <div class="instrument-btns">
              <button class="instrument-btn selected" data-instrument="piano">Grand Piano</button>
              <button class="instrument-btn" data-instrument="epiano">E. Piano</button>
              <button class="instrument-btn" data-instrument="synth">Synth</button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-info" id="footer-info"></span>
      <div class="btn-row">
        <button class="secondary" id="btn-cancel">Cancel</button>
        <button class="primary" id="btn-apply" disabled>Apply (0)</button>
      </div>
    </div>
  </div>
