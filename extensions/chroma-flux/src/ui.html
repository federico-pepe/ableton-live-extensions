<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromaFlux</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }

    /* Animated background */
    #background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      animation: hueShift 8s linear infinite;
      background: radial-gradient(
        circle at 30% 40%,
        rgba(255, 0, 127, 0.4),
        rgba(0, 255, 200, 0.2) 25%,
        rgba(127, 0, 255, 0.3) 50%,
        rgba(255, 100, 0, 0.2) 75%,
        rgba(0, 127, 255, 0.1) 100%
      );
    }

    @keyframes hueShift {
      0% { filter: hue-rotate(0deg) saturate(1.5) brightness(1.1); }
      25% { filter: hue-rotate(90deg) saturate(1.6) brightness(1.15); }
      50% { filter: hue-rotate(180deg) saturate(1.5) brightness(1.1); }
      75% { filter: hue-rotate(270deg) saturate(1.6) brightness(1.15); }
      100% { filter: hue-rotate(360deg) saturate(1.5) brightness(1.1); }
    }

    /* Canvas for lava lamp effect */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Main content container */
    #container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 30px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(2px);
    }

    /* Title */
    h1 {
      text-align: center;
      font-size: 36px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.8), 0 0 40px rgba(0, 255, 200, 0.6);
      animation: rainbow 3s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes rainbow {
      0% { color: #ff00ff; text-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(0, 255, 200, 0.6); }
      25% { color: #00ffff; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(255, 0, 127, 0.6); }
      50% { color: #ffff00; text-shadow: 0 0 20px rgba(255, 255, 0, 0.8), 0 0 40px rgba(255, 127, 0, 0.6); }
      75% { color: #ff00ff; text-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(0, 255, 200, 0.6); }
      100% { color: #ff00ff; text-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(0, 255, 200, 0.6); }
    }

    /* Controls section */
    #controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 15px;
      border: 2px solid rgba(255, 0, 255, 0.5);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.3), inset 0 0 20px rgba(255, 0, 127, 0.1);
    }

    .control-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .control-label {
      color: #00ff88;
      font-weight: bold;
      letter-spacing: 0.1em;
      font-size: 12px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
    }

    /* Toggle buttons */
    .toggle-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .toggle-btn {
      padding: 10px 18px;
      border: 2px solid rgba(255, 0, 200, 0.6);
      background: rgba(255, 0, 200, 0.1);
      color: #ff00c8;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 0 10px rgba(255, 0, 200, 0.3);
    }

    .toggle-btn:hover {
      background: rgba(255, 0, 200, 0.3);
      border-color: rgba(0, 255, 200, 0.8);
      color: #00ffc8;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.6);
    }

    .toggle-btn.active {
      background: rgba(0, 255, 200, 0.4);
      border-color: rgba(0, 255, 200, 0.9);
      color: #00ffff;
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.8), inset 0 0 15px rgba(0, 255, 200, 0.2);
    }

    /* Slider */
    .slider-container {
      width: 100%;
      max-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      border-radius: 5px;
      background: rgba(255, 0, 200, 0.3);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 200, 0.4);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0, 255, 200, 0.9);
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: all 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 25px rgba(0, 255, 200, 1);
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0, 255, 200, 0.9);
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: all 0.2s ease;
    }

    input[type="range"]::-moz-range-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 25px rgba(0, 255, 200, 1);
    }

    .intensity-value {
      color: #00ffff;
      font-size: 14px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 10px;
    }

    button {
      font-family: 'Courier New', monospace;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #fluxButton {
      padding: 16px 40px;
      font-size: 16px;
      background: linear-gradient(135deg, rgba(0, 255, 200, 0.8), rgba(255, 0, 127, 0.8));
      color: #000;
      border: 2px solid rgba(0, 255, 200, 0.9);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.6), 0 0 60px rgba(255, 0, 127, 0.4);
      animation: pulse 1.5s ease-in-out infinite;
    }

    #fluxButton:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.8), 0 0 80px rgba(255, 0, 127, 0.6);
    }

    #fluxButton:active {
      transform: scale(0.98);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 30px rgba(0, 255, 200, 0.6), 0 0 60px rgba(255, 0, 127, 0.4);
      }
      50% {
        box-shadow: 0 0 50px rgba(0, 255, 200, 0.9), 0 0 100px rgba(255, 0, 127, 0.7);
      }
      100% {
        box-shadow: 0 0 30px rgba(0, 255, 200, 0.6), 0 0 60px rgba(255, 0, 127, 0.4);
      }
    }

    #cancelButton {
      padding: 8px 20px;
      font-size: 12px;
      background: rgba(255, 100, 100, 0.2);
      color: #ff6464;
      border: 1px solid rgba(255, 100, 100, 0.5);
      box-shadow: 0 0 10px rgba(255, 100, 100, 0.2);
    }

    #cancelButton:hover {
      background: rgba(255, 100, 100, 0.3);
      border-color: rgba(255, 100, 100, 0.8);
      box-shadow: 0 0 15px rgba(255, 100, 100, 0.4);
    }

    /* Mouse trail particles */
    .trail-particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: trailFade 1s ease-out forwards;
    }

    @keyframes trailFade {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.1);
      }
    }

    /* Ninja Mode Styles */
    body.ninja-mode #background {
      background: radial-gradient(
        circle at 30% 40%,
        rgba(255, 80, 0, 0.5),
        rgba(255, 150, 0, 0.2) 25%,
        rgba(200, 50, 0, 0.4) 50%,
        rgba(255, 100, 0, 0.3) 75%,
        rgba(139, 30, 0, 0.2) 100%
      );
      animation: ninjaPulse 4s ease-in-out infinite;
    }

    @keyframes ninjaPulse {
      0% {
        filter: hue-rotate(0deg) saturate(1.3) brightness(0.9);
      }
      50% {
        filter: hue-rotate(10deg) saturate(1.5) brightness(1.1);
      }
      100% {
        filter: hue-rotate(0deg) saturate(1.3) brightness(0.9);
      }
    }

    body.ninja-mode h1 {
      text-shadow: 0 0 20px rgba(255, 100, 0, 1), 0 0 40px rgba(200, 50, 0, 0.8);
      animation: ninjaGlow 2s ease-in-out infinite;
    }

    @keyframes ninjaGlow {
      0%, 100% { color: #ff6400; }
      50% { color: #ffaa00; }
    }

    body.ninja-mode #controls {
      border-color: rgba(255, 100, 0, 0.7);
      box-shadow: 0 0 30px rgba(255, 100, 0, 0.4), inset 0 0 20px rgba(200, 50, 0, 0.15);
    }

    body.ninja-mode .control-label {
      color: #ffaa00;
      text-shadow: 0 0 10px rgba(255, 100, 0, 0.8);
    }

    body.ninja-mode #fluxButton {
      background: linear-gradient(135deg, rgba(255, 100, 0, 0.9), rgba(200, 50, 0, 0.9));
      border-color: rgba(255, 100, 0, 1);
      box-shadow: 0 0 30px rgba(255, 100, 0, 0.7), 0 0 60px rgba(200, 50, 0, 0.5);
    }

    body.ninja-mode #fluxButton:hover {
      box-shadow: 0 0 40px rgba(255, 100, 0, 0.9), 0 0 80px rgba(200, 50, 0, 0.7);
    }

    #paramScopeRow {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    #paramScopeRow.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <canvas id="canvas"></canvas>

  <div id="container">
    <h1>CHROMA FLUX</h1>

    <div id="controls">
      <div class="control-group">
        <div class="control-label">⚔️ Mode</div>
        <div class="toggle-group">
          <button class="toggle-btn active" data-mode="macro-only">Macro Only</button>
          <button class="toggle-btn" data-mode="ninja">Ninja Mode</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">🎵 Track Scope</div>
        <div class="toggle-group">
          <button class="toggle-btn active" data-scope="current">This Track</button>
          <button class="toggle-btn" data-scope="all">All Tracks</button>
        </div>
      </div>

      <div class="control-group hidden" id="paramScopeRow">
        <div class="control-label">🎛️ Parameter Scope</div>
        <div style="display: flex; gap: 10px; align-items: center; justify-content: center; width: 100%;">
          <span style="color: #ff00c8; font-size: 11px; font-weight: bold;">FEW</span>
          <div class="slider-container" style="max-width: 180px; margin: 0;">
            <input type="range" id="paramScopeSlider" min="0" max="100" value="50">
          </div>
          <span style="color: #ff00c8; font-size: 11px; font-weight: bold;">ALL</span>
        </div>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">⚡ Intensity</div>
        <div class="slider-container">
          <input type="range" id="intensitySlider" min="0" max="100" value="70">
          <div class="intensity-value"><span id="intensityValue">70</span>%</div>
        </div>
      </div>

      <div class="button-group">
        <button id="fluxButton">✨ FLUX IT ✨</button>
        <button id="cancelButton">Cancel</button>
      </div>
    </div>
  </div>

  <script>

    // State
    let state = {
      mode: "macro-only",
      trackScope: "current",
      paramScope: 0.5,  // 0 = few, 1 = all (only used in ninja mode)
      intensity: 70
    };

    // Initialize sliders
    const intensitySlider = document.getElementById("intensitySlider");
    const valueDisplay = document.getElementById("intensityValue");
    intensitySlider.addEventListener("input", (e) => {
      state.intensity = parseInt(e.target.value);
      valueDisplay.textContent = state.intensity;
    });

    const paramScopeSlider = document.getElementById("paramScopeSlider");
    paramScopeSlider.addEventListener("input", (e) => {
      state.paramScope = parseInt(e.target.value) / 100;  // Convert to 0-1 range
    });

    // Toggle buttons for mode
    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        const mode = e.target.dataset.mode;
        if (mode) {
          document.querySelectorAll("[data-mode]").forEach(b => b.classList.remove("active"));
          e.target.classList.add("active");
          state.mode = mode;

          // Show/hide parameter scope slider and update background
          const paramScopeRow = document.getElementById("paramScopeRow");
          if (mode === "ninja") {
            paramScopeRow.classList.remove("hidden");
            document.body.classList.add("ninja-mode");
          } else {
            paramScopeRow.classList.add("hidden");
            document.body.classList.remove("ninja-mode");
          }

          // Switch canvas animation
          startAnimation(mode);
        }
      });
    });

    // Toggle buttons for track scope
    document.querySelectorAll("[data-scope]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        const scope = e.target.dataset.scope;

        if (scope) {
          document.querySelectorAll(`[data-scope]`).forEach(b => b.classList.remove("active"));
          e.target.classList.add("active");
          state.trackScope = scope;
        }
      });
    });

    // Flux button
    document.getElementById("fluxButton").addEventListener("click", () => {
      const paramScope = state.mode === "macro-only"
        ? 1  // Macro only always uses all macros
        : state.paramScope;  // Ninja mode uses the slider (already 0-1 range)

      closeWithResult({
        mode: state.mode,
        trackScope: state.trackScope,
        paramScope: paramScope,
        intensity: state.intensity / 100
      });
    });

    // Cancel button
    document.getElementById("cancelButton").addEventListener("click", () => {
      closeWithResult(null);
    });

    // Mouse trail effect
    document.addEventListener("mousemove", (e) => {
      createTrail(e.clientX, e.clientY);
    });

    function createTrail(x, y) {
      const particle = document.createElement("div");
      particle.className = "trail-particle";
      const size = Math.random() * 8 + 4;
      particle.style.width = size + "px";
      particle.style.height = size + "px";
      particle.style.left = (x - size / 2) + "px";
      particle.style.top = (y - size / 2) + "px";

      const hues = [
        "rgba(255, 0, 200, 0.8)",
        "rgba(0, 255, 200, 0.8)",
        "rgba(255, 255, 0, 0.8)",
        "rgba(127, 200, 255, 0.8)"
      ];
      particle.style.background = hues[Math.floor(Math.random() * hues.length)];
      particle.style.boxShadow = `0 0 ${size * 2}px ${particle.style.background}`;

      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 1000);
    }

    // Canvas animation — mode-aware
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let animFrame;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // Lava lamp data (Macro Only mode)
    const blobs = Array.from({ length: 5 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      size: 30 + Math.random() * 50,
      hue: Math.random() * 360
    }));

    // Scan line data (Ninja Mode)
    let scanLines = [];
    function initScanLines() {
      scanLines = Array.from({ length: 20 }, (_, i) => ({
        y: (i / 20) * canvas.height,
        vy: 0.3 + Math.random() * 0.5,
        opacity: 0.3 + Math.random() * 0.4
      }));
    }
    initScanLines();

    function drawLavaLamp() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      blobs.forEach((blob) => {
        blob.x += blob.vx;
        blob.y += blob.vy;
        blob.hue = (blob.hue + 1) % 360;

        if (blob.x < 0 || blob.x > canvas.width) blob.vx *= -1;
        if (blob.y < 0 || blob.y > canvas.height) blob.vy *= -1;

        ctx.fillStyle = `hsla(${blob.hue}, 100%, 50%, 0.15)`;
        ctx.beginPath();
        ctx.arc(blob.x, blob.y, blob.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = `hsla(${blob.hue}, 100%, 70%, 0.3)`;
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      animFrame = requestAnimationFrame(drawLavaLamp);
    }

    function drawScanLines() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Line density driven by paramScope slider (0-100)
      const lineCount = 3 + Math.floor((state.paramScope * 100 / 100) * 40);

      // Generate and draw lines
      ctx.strokeStyle = "hsla(20, 100%, 55%, 0.6)";
      ctx.lineWidth = 1;

      for (let i = 0; i < lineCount; i++) {
        const line = scanLines[i % scanLines.length];
        line.y += line.vy;

        // Wrap around
        if (line.y > canvas.height) {
          line.y = -2;
          line.vy = 0.3 + Math.random() * 0.5;
        }

        ctx.globalAlpha = line.opacity;
        ctx.beginPath();
        ctx.moveTo(0, line.y);
        ctx.lineTo(canvas.width, line.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      animFrame = requestAnimationFrame(drawScanLines);
    }

    function startAnimation(mode) {
      cancelAnimationFrame(animFrame);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (mode === "macro-only") {
        drawLavaLamp();
      } else {
        drawScanLines();
      }
    }

    // Start with Macro Only
    startAnimation("macro-only");

    // Bridge protocol for closing dialog
    function closeWithResult(result) {
      const isWebKitMessageHandlerAvailable =
        window.webkit &&
        window.webkit.messageHandlers &&
        window.webkit.messageHandlers.live;

      const isWebView2 = window.chrome && window.chrome.webview;

      function doSendMessage(message) {
        if (isWebKitMessageHandlerAvailable) {
          window.webkit.messageHandlers.live.postMessage(message);
        } else if (isWebView2) {
          window.chrome.webview.postMessage(message);
        }
      }

      doSendMessage({
        method: "close_and_send",
        params: [JSON.stringify(result)]
      });
    }
  </script>
</body>
</html>
