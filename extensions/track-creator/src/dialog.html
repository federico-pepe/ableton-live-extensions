<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Tracks</title>
  <script>
    const isWebKitMessageHandlerAvailable = window.webkit &&
      window.webkit.messageHandlers &&
      window.webkit.messageHandlers.live;
    const isWebView2 = window.chrome && window.chrome.webview;

    function doSendMessage(message) {
      if (isWebKitMessageHandlerAvailable) {
        window.webkit.messageHandlers.live.postMessage(message);
      } else if (isWebView2) {
        window.chrome.webview.postMessage(message);
      }
    }

    function closeWithResult(result) {
      doSendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
    }

    function selectType(type) {
      document.getElementById('typeAudio').classList.toggle('active', type === 'audio');
      document.getElementById('typeMidi').classList.toggle('active', type === 'midi');
      document.getElementById('trackType').value = type;
    }

    function submit() {
      var count = parseInt(document.getElementById('count').value, 10);
      var prefix = document.getElementById('prefix').value || 'Audio';
      var type = document.getElementById('trackType').value;

      if (!Number.isFinite(count) || count < 1) return;

      closeWithResult({ count, prefix, type });
    }
  </script>
  <style>
    :root {
      --bg: #272727;
      --input-bg: #1e1e1e;
      --accent: #0099ff;
      --text: #cccccc;
      --text-dim: #666666;
      --border: #444444;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100vh;
      background-color: var(--bg);
      font-family: 'Lucida Grande', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 320px;
      padding: 24px;
    }

    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 20px 0;
      color: var(--text);
    }

    .field {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 500;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .type-toggle button {
      flex: 1;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
    }

    .type-toggle button.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .type-toggle button:hover:not(.active) {
      border-color: var(--accent);
      color: var(--text);
    }

    .button-container {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      padding: 6px 14px;
      font-family: inherit;
      font-size: 12px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
    }

    button:hover {
      background-color: var(--accent);
      color: #000;
    }

    button.secondary {
      border-color: var(--border);
      color: var(--text-dim);
    }

    button.secondary:hover {
      background: transparent;
      border-color: var(--text-dim);
      color: var(--text);
    }
  </style>
</head>

<body>
  <div class="modal-content">
    <h1>Create Tracks</h1>

    <input type="hidden" id="trackType" value="audio">
    <div class="type-toggle">
      <button id="typeAudio" class="active" onclick="selectType('audio')">Audio</button>
      <button id="typeMidi" onclick="selectType('midi')">MIDI</button>
    </div>

    <div class="field">
      <label class="field-label" for="count">How many</label>
      <input type="number" id="count" min="1" max="64" value="1">
    </div>

    <div class="field">
      <label class="field-label" for="prefix">Track name</label>
      <input type="text" id="prefix" placeholder="Audio" value="Audio">
    </div>

    <div class="button-container">
      <button class="secondary" onclick="closeWithResult(null)">Cancel</button>
      <button onclick="submit()">Create</button>
    </div>
  </div>
</body>

</html>
